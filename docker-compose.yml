version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: deck-card-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: deck_card_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  deck-card-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fc-deck-card-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/deck_card_db
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data: