name: Build and Deploy to AWS ECR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Build with Maven
        run: mvn -B package -DskipTests

  deploy:
    # Only the push-to-main event may assume the AWS role.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637107289291:role/github-actions-deck-card-service
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: fc/fc-deck-card-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}" \
            -t "${REGISTRY}/${REPOSITORY}:latest" .
          docker push --all-tags "${REGISTRY}/${REPOSITORY}"

      - name: Inspect OIDC claims
        id: oidc
        shell: bash
        run: |
          response="$(curl --fail --silent \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"

          token="$(jq -r '.value' <<< "$response")"
          payload="$(cut -d '.' -f2 <<< "$token")"

          # Add base64 padding if needed.
          payload="$payload$(printf '%*s' $(( (4 - ${#payload} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$payload" | base64 --decode | jq '{sub, aud, repository, event_name, ref, sha}'