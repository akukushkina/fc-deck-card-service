server:
  port: 8080

spring:
  application:
    name: fc-deck-card-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/deck_card_db}
      auto-index-creation: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Management & Observability Metrics
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.platform: DEBUG
    org.springframework.data.mongodb: INFO